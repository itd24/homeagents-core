# Model identifiers below were verified current as of 2026-08-24. LLM
# provider model names churn fast (DeepSeek retired deepseek-chat/
# deepseek-reasoner on 2026-07-24 with no grace alias). Re-verify against
# each provider's docs before you next bump this file, don't trust it
# blindly months from now:
#   DeepSeek: https://api-docs.deepseek.com/quick_start/pricing
#   Z.ai:     https://docs.z.ai/guides/llm/glm-5.3
#   Anthropic: https://docs.claude.com/en/docs/about-claude/models
#   OpenAI:   https://developers.openai.com/api/docs/pricing

model_list:
  # --- cheap default (dev, home, everyday conversation) ---
  # DeepSeek V4 Flash, thinking disabled -> replicates old "deepseek-chat"
  # behavior/cost profile now that the alias is retired.
  - model_name: fast
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 16384
      thinking:
        type: disabled
      # Per-virtual-model soft ceiling (layer 3 of 4). Real numbers are a
      # starting guess — tune after a week of real spend-log entries.
      max_budget: 20
      budget_duration: 30d

  # --- coding, harder tasks: same model, thinking enabled for better reasoning ---
  - model_name: coder
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 16384
      thinking:
        type: enabled
      max_budget: 50
      budget_duration: 30d

  # --- software architecture / long-horizon planning ---
  # GLM-5.3's metered API only opened 2026-08-18. Reasoning can no longer be
  # disabled on this model (low/high/max only) — set the cheapest tier as
  # the default and escalate deliberately per-request when needed.
  - model_name: architect
    litellm_params:
      model: zai/glm-5.3
      api_key: os.environ/ZAI_API_KEY
      max_tokens: 16384
      reasoning_effort: low
      max_budget: 50
      budget_duration: 30d

  # --- deliberate premium escalation only ---
  - model_name: premium
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16384
      max_budget: 30
      budget_duration: 30d

  # --- cheap current-gen OpenAI option, available if you specifically want
  #     GPT-class output for something. gpt-4.1 is two generations stale;
  #     gpt-5.6-luna is the current cheap tier ($0.20/$1.20 per M tokens). ---
  - model_name: openai-fallback
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 8192
      max_budget: 20
      budget_duration: 30d

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  model_group_alias:
    fast: fast
    coder: coder
    architect: architect
    premium: premium
    openai-fallback: openai-fallback
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

  # Layer 1 of 4: provider-level hard ceiling. This is the real backstop —
  # it caps the whole DeepSeek key regardless of which virtual model burned
  # through it, so a bug in the per-model budgets above (layer 3) can't
  # silently drain a provider you didn't intend to touch.
  # Verify these budget_limit numbers against your actual prepaid balances
  # before relying on them; the values below are placeholders.
  provider_budget_config:
    deepseek:
      budget_limit: 70
      time_period: 30d
    zai:
      budget_limit: 60
      time_period: 30d
    anthropic:
      budget_limit: 50
      time_period: 30d
    openai:
      budget_limit: 40
      time_period: 30d
