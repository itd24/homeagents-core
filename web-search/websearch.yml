services:
  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    networks: [ai-platform-net]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./config/searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8082/
      # Overrides server.secret_key in config/searxng/settings.yml. Falls back to
      # the placeholder so the container never starts with a missing key.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-searxng-secret}
  web-search-mcp:
    # Image is built and tagged from the homeagents-mcp-servers repository
    # (websearch/ folder):  docker build -t web-search-mcp:latest websearch
    image: web-search-mcp:latest
    container_name: web-search-mcp
    restart: unless-stopped
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-8}
      SEARXNG_TIMEOUT: ${SEARXNG_TIMEOUT:-15}
      TAVILY_TIMEOUT: ${TAVILY_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - ai-platform-net

networks:
  ai-platform-net:
    external: true